name: gscreen_flutter
description: "Google Drive Photo Slideshow - Cross-platform digital signage application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  
  # Network
  http: ^1.2.2
  
  # Media
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  
  # Google Drive
  googleapis: ^14.0.0
  googleapis_auth: ^1.6.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
